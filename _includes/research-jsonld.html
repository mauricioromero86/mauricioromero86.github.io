      "abstract": "We evaluate a randomized dropout prevention program across 4,000 schools in Guatemala, where 30% of children leave school during the primary-to-secondary transition. Schools were assigned to receive a guidance manual and training; the manual, the training and a list of high-risk students; the manual, the training, the list, and behavioral nudges; or control. All treatments reduced dropout in the transition from primary to secondary by 1.2 percentage points from a 34% base, but effects faded after two years (i.e., there is no difference in the likelihood of being enrolled in secondary school after the first year). Still, the program increased years of schooling by 0.012, and its low cost (USD 2–3 per student) and successful large-scale implementation make it a promising, cost-effective approach to increasing schooling in resource-constrained contexts.",

      "abstract": "The incidence of redistributive policies is central to whether they meet their stated goals. We study this in the context of one of the world's largest affirmative action programs in schooling: a 25% quota in all Indian private schools for students from disadvantaged groups. We use lottery-based estimates to show that, although students admitted under the quota attend more expensive and preferred schools on average, the distribution of program benefits is very regressive. Program applicants are concentrated among more-educated and better-off households. Consequently, 7.4% of the program spending accrues to the bottom socioeconomic quintile, compared to 24.3% to the top quintile. In total, two-thirds of the per-child cost of a quota seat is inframarginal for school choice. We use rich survey data to show that low application rates for poorer children are not driven by preferences and beliefs. Instead, information constraints and application frictions appear to be key. Finally, we use a randomized intervention to confirm the importance of these frictions and further demonstrate that alleviating a single constraint (e.g., information) may not reduce regressive selection, even if it boosts application rates substantially. Our results demonstrate how constraints facing potential applicants can make redistributive policies regressive in practice. Appropriate policy interventions must consider the joint incidence of these constraints to reduce regressivity.",

      "abstract": "Public health benefit plans must choose what services are covered with public funds. This coverage choice may affect the prices of covered services through multiple channels. First, coverage reduces out-of-pocket expenditures, making consumers less sensitive to the cost of treatment. In an environment where suppliers have market power (as is often the case with pharmaceutical drugs) this could result in higher prices. The second channel is an increase in competition among drugs listed in the benefit plan with the same therapeutic properties, which could result in lower prices. Thus, the net effect on prices is unclear and depends on consumer sensitivity to prices and the level of competition among drugs. Using a difference-in-difference strategy, I study the effect of including a pharmaceutical drug in the national benefit plan of Colombia, a country with a competitive health insurance market in which all insurance companies offer the same plan (the national benefit plan) and charge the same premium. Drug prices decrease by 14% on average after they are listed in the benefit plan and sales increase by 123%. However, if a drug faces no competition and is listed in the benefit plan its price increases. Coverage also affects the prices of unlisted services: Within a therapeutic class, the prices of drugs which are not listed in the benefit plan decrease as the market share of competing drugs listed in the benefit plan increases. I conclude with a discussion of the role of financial incentives in health care markets.",

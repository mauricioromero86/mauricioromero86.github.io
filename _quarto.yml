project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - teaching.qmd
    - data-code.qmd
    - cdmx.qmd
    - courses/*.qmd

website:
  title: "Mauricio Romero"
  description: "Mauricio Romero — Associate Professor of Economics at ITAM. Development, education, and public economics."
  site-url: "https://mauricio-romero.com"
  image: "https://mauricio-romero.com/img/headshot.jpg"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    creator: "@marome1"
    site: "@marome1"
  google-analytics: "G-JM6020WT15"
  favicon: img/favicon.png
  navbar:
    title: "Mauricio Romero"
    right:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Data & Code"
        href: data-code.qmd
      - text: "CDMX"
        href: cdmx.qmd
      - icon: envelope
        href: "mailto:mtromero@itam.mx"
      - icon: google
        href: "https://scholar.google.com/citations?user=BD8UfDoAAAAJ"

format:
  html:
    theme:
      light: [theme.scss, theme-light.scss]
      dark: [theme.scss, theme-dark.scss]
    include-in-header: _includes/website-jsonld.html
    filters:
      - filters/seo-meta.lua
    page-layout: article
    toc: false
    back-to-top-navigation: true
    grid:
      body-width: 1040px
      margin-width: 200px
      sidebar-width: 220px

project:
  type: website
  output-dir: _site
  resources:
    # CV is linked only from the navbar/button config, which Quarto's resource
    # scanner does not follow — declare it explicitly so it lands in _site/gh-pages.
    - pdfs/Mauricio-Romero-CV.pdf
    # Hike/ride GPX tracks (CDMX page) are referenced from raw-HTML map blocks the
    # scanner does not follow — declare the folder so the .gpx files publish.
    - hikes/*.gpx
    # OG card + apple-touch-icon are referenced only via absolute URLs (website.image,
    # raw-HTML <link>), which the resource scanner does not follow — declare them.
    - img/og-card.png
    - img/apple-touch-icon.png
  render:
    - index.qmd
    - research.qmd
    - teaching.qmd
    - data-code.qmd
    - cdmx.qmd
    - courses/*.qmd

website:
  title: "Mauricio Romero"
  description: "Mauricio Romero — Associate Professor of Economics at ITAM. Development, education, and public economics."
  site-url: "https://mauricio-romero.com"
  image: "https://mauricio-romero.com/img/og-card.png"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    creator: "@marome1"
    site: "@marome1"
  google-analytics: "G-JM6020WT15"
  favicon: img/favicon.png
  page-footer:
    left: "© 2026 Mauricio Romero"
    right: "Built with [Quarto](https://quarto.org) · [source](https://github.com/mauricioromero86)"
  navbar:
    title: "Mauricio Romero"
    right:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Data & Code"
        href: data-code.qmd
      - text: "CDMX"
        href: cdmx.qmd
      - icon: envelope
        href: "mailto:mtromero@itam.mx"
      - icon: mortarboard
        href: "https://scholar.google.com/citations?user=BD8UfDoAAAAJ"
        aria-label: "Google Scholar"

format:
  html:
    theme:
      light: [theme.scss, theme-light.scss]
      dark: [theme.scss, theme-dark.scss]
    include-in-header: _includes/website-jsonld.html
    filters:
      - filters/seo-meta.lua
    page-layout: article
    toc: false
    back-to-top-navigation: true
    grid:
      body-width: 1040px
      margin-width: 200px
      sidebar-width: 220px
